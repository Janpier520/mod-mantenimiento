# SDD Configuration for Módulo Mantenimiento de Equipos
project: mod-mantenimiento
stack:
  framework: SvelteKit 5
  language: TypeScript
  orm: Drizzle ORM with SQLite (libSQL)
  css: Tailwind CSS v4
  ui: shadcn-svelte
  auth: bcryptjs + session tokens
  database: SQLite via libSQL client
adapter: '@sveltejs/adapter-node'
strict_tdd: false
testing:
  runner: vitest
  note: Vitest 4 with v8 coverage. In-memory SQLite via src/lib/server/db/test-helpers.ts (see openspec/changes/2026-08-06-test-coverage).
formatter: prettier
linter: eslint
type_checker: svelte-check
persistence:
  mode: openspec
  path: openspec/
